<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地名検索マップ＆航空地図 (雨雲レーダー対応)</title>
    
    <!-- Leaflet API (雨雲描画用ライブラリ) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }
        #location-input {
            flex: 2;
            min-width: 200px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }
        #location-input:focus {
            border-color: #3498db;
        }
        #start-input {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fafafa;
        }
        #start-input:focus {
            border-color: #2ecc71;
            background-color: #fff;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-search {
            background-color: #3498db;
            color: white;
        }
        .btn-clear {
            background-color: #e74c3c;
            color: white;
        }
        .btn-route {
            background-color: #2ecc71;
            color: white;
            padding: 10px 18px;
            font-size: 14px;
        }
        .viewer-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 60vh;
            min-height: 400px;
        }
        @media (max-width: 768px) {
            .viewer-container {
                grid-template-columns: 1fr;
                height: 80vh;
            }
        }
        #leaflet-map, iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: #eaeded;
        }
        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eaeded;
            border-radius: 8px;
            color: #7f8c8d;
            font-size: 16px;
            border: 2px dashed #bdc3c7;
            box-sizing: border-box;
        }
        .info-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>地名検索マップ＆航空地図 (雨雲レーダー機能付)</h1>
    
    <div class="search-box">
        <input type="text" id="location-input" placeholder="目的地（地名や駅名、住所）を入力" autofocus>
        <button class="btn-search" onclick="searchLocation()">検索</button>
        <button class="btn-clear" onclick="clearSearch()">クリア</button>
        
        <input type="text" id="start-input" placeholder="出発駅（例：東京駅）">
        <button class="btn-route" onclick="searchRoute()">この場所へ行く</button>
    </div>

    <div class="viewer-container">
        <!-- 左側：Leaflet地図 (雨雲レーダー付き) または Google経路マップ -->
        <div id="left-view">
            <div class="placeholder">ここに雨雲レーダー付き地図が表示されます</div>
        </div>
        <!-- 右側：Google Satellite 航空地図 -->
        <div id="right-view">
            <div class="placeholder">ここに航空地図が表示されます</div>
        </div>
    </div>
    
    <div class="info-text">※左上のレイヤーアイコンから雨雲表示の切替が可能です。経路検索時は左側にルートが表示されます。</div>
</div>

<script>
   let map = null; // Leafletインスタンス保持用
    let radarLayers = []; // 雨雲レイヤーの配列
    let radarTimeStamps = []; // タイムスタンプ配列
    let animationTimer = null; // アニメーションタイマー
    let currentIndex = 0; // 現在表示中のインデックス

    // Enterキー入力での検索イベント
    document.getElementById('location-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchLocation();
    });
    document.getElementById('start-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchRoute();
    });

    // ジオコーディングAPI (OpenStreetMap Nominatim)
    async function getCoordinates(query) {
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await response.json();
            if (data && data.length > 0) {
                return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
            }
        } catch (e) {
            console.error('位置情報の取得に失敗:', e);
        }
        return null;
    }

    // 雨雲データ（直近の過去〜現在のフレーム一覧）を取得する関数（修正版）
    async function loadRainViewerRadar(mapInstance) {
        try {
            const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
            const data = await response.json();
            
            if (!data || !data.radar || !data.radar.past) return;

            // 過去のデータフレームを取得（直近10件程度）
            const frames = data.radar.past;
            
            // 既存のアニメーション・レイヤーをクリア
            if (animationTimer) clearInterval(animationTimer);
            radarLayers.forEach(layer => mapInstance.removeLayer(layer));
            radarLayers = [];
            radarTimeStamps = [];

            // 各フレームのタイルレイヤーを作成
            frames.forEach(frame => {
                // 【修正ポイント】RainViewerで最も安定して画像を取得できるURLフォーマットに変更
                // /512/{z}/{x}/{y}/2/1_1.png (512px高解像度・標準カラー指定)
                const tileUrl = `https://tilecache.rainviewer.com/v2/radar/${frame.time}/512/{z}/{x}/{y}/2/1_1.png`;
                
                const layer = L.tileLayer(tileUrl, {
                    opacity: 0, // 初期状態は非表示
                    attribution: '© RainViewer',
                    tileSize: 256,
                    zoomOffset: -1,
                    zIndex: 500 // 【修正ポイント】基本地図より確実に前面に表示されるよう設定
                }).addTo(mapInstance);

                radarLayers.push(layer);
                
                // JST形式の時刻表示
                const date = new Date(frame.time * 1000);
                const timeStr = date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
                radarTimeStamps.push(timeStr);
            });

            if (radarLayers.length === 0) return;

            // コントロールUI（ボタンと時刻）
            const RadarControl = L.Control.extend({
                options: { position: 'bottomleft' },
                onAdd: function() {
                    const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                    container.style.backgroundColor = 'white';
                    container.style.padding = '6px 12px';
                    container.style.fontSize = '13px';
                    container.style.fontWeight = 'bold';
                    container.style.borderRadius = '4px';
                    container.style.boxShadow = '0 2px 4px rgba(0,0,0,0.2)';
                    container.innerHTML = `
                        <button id="play-btn" style="padding:4px 8px; cursor:pointer; font-weight:bold;">一時停止</button>
                        <span id="radar-time" style="margin-left:8px;">--:--</span>
                    `;
                    L.DomEvent.disableClickPropagation(container);
                    return container;
                }
            });
            mapInstance.addControl(new RadarControl());

            // レイヤーの表示切替処理
            function showFrame(index) {
                radarLayers.forEach((layer, i) => {
                    // 【修正ポイント】透過度を少し高めの0.75に設定して雨雲をくっきり表示
                    layer.setOpacity(i === index ? 0.75 : 0);
                });
                const timeEl = document.getElementById('radar-time');
                if (timeEl) timeEl.innerText = radarTimeStamps[index];
            }

            currentIndex = radarLayers.length - 1; // 最新の雨雲からスタート
            showFrame(currentIndex);

            // アニメーション再生（1秒間隔）
            let isPlaying = true;
            animationTimer = setInterval(() => {
                if (isPlaying) {
                    currentIndex = (currentIndex + 1) % radarLayers.length;
                    showFrame(currentIndex);
                }
            }, 1000);

            setTimeout(() => {
                const btn = document.getElementById('play-btn');
                if (btn) {
                    btn.onclick = () => {
                        isPlaying = !isPlaying;
                        btn.innerText = isPlaying ? '一時停止' : '再生';
                    };
                }
            }, 100);

        } catch (e) {
            console.error('雨雲アニメーションの読み込みに失敗:', e);
            alert('雨雲データの取得に失敗しました。');
        }
    }

    // 場所検索処理
    async function searchLocation() {
        const query = document.getElementById('location-input').value.trim();
        if (!query) {
            alert('目的地を入力してください。');
            return;
        }

        const coords = await getCoordinates(query);
        const lat = coords ? coords.lat : 35.681236;
        const lon = coords ? coords.lon : 139.767125;

        const leftView = document.getElementById('left-view');
        leftView.innerHTML = `<div id="leaflet-map"></div>`;

        if (map) map.remove();

        map = L.map('leaflet-map').setView([lat, lon], 10); // 広域が見えるようズーム値を少し引き気味(10)に調整

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        L.marker([lat, lon]).addTo(map).bindPopup(query).openPopup();

        // 雨雲レーダーアニメーションのロード
        await loadRainViewerRadar(map);

        // 右側：Google Satellite 航空写真
        const rightView = document.getElementById('right-view');
        const satelliteUrl = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&output=embed&t=h&z=15`;
        rightView.innerHTML = `<iframe id="satellite-frame" src="${satelliteUrl}" allowfullscreen></iframe>`;
    }

    // 経路検索
    function searchRoute() {
        const query = document.getElementById('location-input').value.trim();
        const start = document.getElementById('start-input').value.trim();
        
        if (!query || !start) {
            alert('目的地と出発駅の両方を入力してください。');
            return;
        }

        if (animationTimer) clearInterval(animationTimer);
        if (map) { map.remove(); map = null; }

        const routeUrl = `https://maps.google.com/maps?saddr=${encodeURIComponent(start)}&daddr=${encodeURIComponent(query)}&dirflg=r&output=embed`;
        const satelliteUrl = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&output=embed&t=h&z=15`;

        document.getElementById('left-view').innerHTML = `<iframe id="map-frame" src="${routeUrl}" allowfullscreen></iframe>`;
        document.getElementById('right-view').innerHTML = `<iframe id="satellite-frame" src="${satelliteUrl}" allowfullscreen></iframe>`;
    }

    // クリア処理
    function clearSearch() {
        document.getElementById('location-input').value = '';
        document.getElementById('start-input').value = '';
        
        if (animationTimer) clearInterval(animationTimer);
        if (map) { map.remove(); map = null; }

        document.getElementById('left-view').innerHTML = `<div class="placeholder">ここに雨雲レーダー付き地図が表示されます</div>`;
        document.getElementById('right-view').innerHTML = `<div class="placeholder">ここに航空地図が表示されます</div>`;
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>地名検索マップ＆航空地図</title>
    
    <!-- iPhoneホーム画面追加用の設定 (PWA対応) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="検索マップ">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f5f7fa;
            color: #333;
            overflow: hidden;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            color: #2c3e50;
            margin: 5px 0 15px 0;
        }
        .search-box {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin-bottom: 15px;
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }
        #location-input:focus { border-color: #3498db; }
        #start-input:focus { border-color: #2ecc71; }

        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 14px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-search { background-color: #3498db; color: white; }
        .btn-weather { background-color: #f39c12; color: white; }
        .btn-current { background-color: #16a085; color: white; }
        .btn-clear { background-color: #e74c3c; color: white; }
        .btn-route { background-color: #2ecc71; color: white; }

        .viewer-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            flex: 1;
            min-height: 0;
            margin-bottom: 10px;
        }
        @media (min-width: 768px) {
            .viewer-container {
                grid-template-columns: 1fr 1fr;
            }
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            background: #eaeded;
        }
        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eaeded;
            border-radius: 12px;
            color: #7f8c8d;
            font-size: 14px;
            text-align: center;
            padding: 20px;
            border: 2px dashed #bdc3c7;
            box-sizing: border-box;
        }
        .info-text {
            text-align: center;
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>地名検索マップ＆航空地図</h1>
    
    <!-- 上段：目的地検索 & ボタン群 -->
    <div class="search-box">
        <input type="text" id="location-input" placeholder="目的地（地名・駅名・住所）" autofocus>
        <div class="btn-group">
            <button class="btn-search" onclick="searchLocation()">検索</button>
            <button class="btn-weather" onclick="openWeather()">天気</button>
            <button class="btn-current" onclick="openCurrentLocation()">現在地</button>
            <button class="btn-clear" onclick="clearSearch()">消去</button>
        </div>
    </div>

    <!-- 下段：出発駅・経路 -->
    <div class="search-box">
        <input type="text" id="start-input" placeholder="出発地（地名・駅名・住所）">
        <button class="btn-route" onclick="searchRoute()">ここから行く</button>
    </div>

    <!-- マップ表示エリア -->
    <div class="viewer-container" id="viewer-container">
        <div class="placeholder" id="map-placeholder">ここにGoogleマップが表示されます</div>
        <div class="placeholder" id="satellite-placeholder">ここに航空地図が表示されます</div>
    </div>
    
    <div class="info-text">※「天気」「現在地」ボタンを押すと、別タブでピンポイント情報を開きます。</div>
</div>

<script>
    document.getElementById('location-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { document.activeElement.blur(); searchLocation(); }
    });
    document.getElementById('start-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { document.activeElement.blur(); searchRoute(); }
    });

    function searchLocation() {
        const query = document.getElementById('location-input').value.trim();
        if (!query) { alert('目的地を入力してください。'); return; }

        const container = document.getElementById('viewer-container');
        const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&output=embed&t=m&z=15`;
        const satelliteUrl = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&output=embed&t=h&z=15`;

        container.innerHTML = `
            <iframe id="map-frame" src="${mapUrl}" allowfullscreen></iframe>
            <iframe id="satellite-frame" src="${satelliteUrl}" allowfullscreen></iframe>
        `;
    }

    function searchRoute() {
        const query = document.getElementById('location-input').value.trim();
        const start = document.getElementById('start-input').value.trim();
        
        if (!query) { alert('先に目的地を入力してください。'); return; }
        if (!start) { alert('出発地を入力してください。'); return; }

        const container = document.getElementById('viewer-container');
        const routeUrl = `https://maps.google.com/maps?saddr=${encodeURIComponent(start)}&daddr=${encodeURIComponent(query)}&dirflg=r&output=embed`;
        const satelliteUrl = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&output=embed&t=h&z=15`;

        container.innerHTML = `
            <iframe id="map-frame" src="${routeUrl}" allowfullscreen></iframe>
            <iframe id="satellite-frame" src="${satelliteUrl}" allowfullscreen></iframe>
        `;
    }

    function openWeather() {
        const query = document.getElementById('location-input').value.trim();
        if (!query) { alert('目的地を入力してください。'); return; }

        const weatherUrl = `https://www.google.com/search?q=${encodeURIComponent(query + ' 天気')}`;
        window.open(weatherUrl, '_blank');
    }

    // 「現在地」ボタン：警告メッセージが出ないGoogleマップへ直接遷移
    function openCurrentLocation() {
        if (!navigator.geolocation) {
            alert('お使いのブラウザは位置情報に対応していません。');
            window.open('https://www.google.com/maps', '_blank');
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                // Googleマップで現在地を開く（システムメッセージやエラーが出ません）
                const mapUrl = `https://www.google.com/maps?q=${lat},${lng}`;
                window.open(mapUrl, '_blank');
            },
            function(error) {
                alert('位置情報の取得に失敗しました。');
                window.open('https://www.google.com/maps', '_blank');
            }
        );
    }

    function clearSearch() {
        document.getElementById('location-input').value = '';
        document.getElementById('start-input').value = '';
        document.getElementById('location-input').focus();

        const container = document.getElementById('viewer-container');
        container.innerHTML = `
            <div class="placeholder" id="map-placeholder">ここにGoogleマップが表示されます</div>
            <div class="placeholder" id="satellite-placeholder">ここに航空地図が表示されます</div>
        `;
    }
</script>

</body>
</html>
